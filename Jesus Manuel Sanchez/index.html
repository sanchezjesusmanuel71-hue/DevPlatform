<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body-index">

    <div>
        <section class="container-form">
            <div class="contenido-form">
                <h1>Dev<span>Platform</span></h1>
                <p>Ingresa tus credenciales para acceder al panel de control</p>
            </div>

            <form action="dashboard.html" method="get">
                <label for="correo">Correo Electronico *</label>
                <input type="email" id="correo" name="correo-usuario" placeholder="ejemplo@sena.edu.co" required>

                <label for="contraseña">Contraseña *</label>
                <input type="password" id="contraseña" name="contraseña-usuario" placeholder="••••••••" minlength="6" required>

                <label for="rol">Rol de Desarrollo *</label>
                    <select id="rol" name="rol-desarrollador" required>
                        <option value="" selected disabled>Seleccione una opcion</option>
                        <option value="desarrollador-frontend">Desarrollador Frontend</option>
                        <option value="desarrollador-backend">Desarrollador Backend</option>
                        <option value="desarrollador-fullstack">Desarrollador Fullstack</option>
                    </select>

                    <div class="checkbox">
                        <input type="checkbox"  id="check" name="checkbox" required>
                        <span> acepto los terminos de servisios y politicas de privacidad</span>
                    </div>
                    


                    <button type="submit">Ingresar al Dashboard</button>

                    
            </form>
        </section>
    </div>
    


</body>
</html>
